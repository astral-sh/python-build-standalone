[project]
name = "python-build-standalone"
version = "0.1.0"
description = "Produces standalone, highly-redistributable builds of Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.37",
    "boto3-stubs[s3]>=1.42",
    "docker>=7.1.0",
    "jinja2>=3.1.5",
    "jsonschema>=4.23.0",
    "junitparser>=4.0.2",
    "pyyaml>=6.0.2",
    "six>=1.17.0",
    "tomli>=2.2.1",
    "typing-extensions>=4.14.1",
    "zstandard>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pythonbuild"
module-root = ""

[dependency-groups]
check = [
    "ruff>=0.15.7",
    "ty>=0.0.84",
    "types-jinja2>=2.11.9",
    "types-jsonschema>=4.26.0.20260324",
    "types-pyyaml>=6.0.12.20250915",
]
dev = [
    "moto[server]>=5.1.22",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

[tool.ty.src]
include = ["pythonbuild", "check.py", "build.py"]

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
redundant-condition-strict = "error"
unsound-return-statement = "error"

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true

[tool.uv]
no-build = true
require-build-hashes = true
no-binary-package = ["python-build-standalone"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
