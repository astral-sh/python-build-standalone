name: "AI policy"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue number"
        required: false
        type: number
      pull_request:
        description: "A pull request number"
        required: false
        type: number
      head_sha:
        description: "The pull request head SHA supplied by the dispatcher"
        required: false
        type: string
      label:
        description: "The applied policy label"
        required: true
        type: choice
        options:
          - bot:ai-policy-comment
          - bot:ai-policy-close

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.issue || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'astral-sh/python-build-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: automations
      deployment: false
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: "Get policy token"
        id: token
        uses: astral-sh/github-actions/simple-token-service@ecaa281a478297a7f6ad7ab58da2779de4771ca0
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            issues: write
            pull_requests: write

      - name: "Apply AI policy"
        uses: astral-sh/github-actions/ai-policy@ecaa281a478297a7f6ad7ab58da2779de4771ca0
        with:
          token: ${{ steps.token.outputs.token }}
          number: ${{ inputs.issue || inputs.pull_request }}
          label: ${{ inputs.label }}
