name: windows

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1
  # Keep uv's cache on the same volume as the workspace so uv can hardlink
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

permissions: { }

jobs:
  crate-build:
    needs:
      - generate-matrix
    if: fromJson(needs.generate-matrix.outputs.crate-build-matrix).include[0] != null
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.crate-build-matrix) }}
      fail-fast: false
    name: crate / ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit rustc version
        run: |
          rustc --version > .rustc-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:/Rust/.cargo/registry
            C:/Rust/.cargo/git
            target
          key: ${{ runner.os }}-pythonbuild-${{ hashFiles('Cargo.lock', '.rustc-version') }}

      - name: Build
        run: |
          cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.crate_artifact_name }}
          path: target/release/pythonbuild.exe

  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.set-matrix.outputs.groups }}
      crate-build-matrix: ${{ steps.set-matrix.outputs.crate-build-matrix }}
      libffi-prepare-hashes: ${{ steps.set-matrix.outputs.libffi-prepare-hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Get pull request labels
        id: get-labels
        env:
          PULL_REQUEST_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Convert GitHub labels array to comma-separated string
          LABELS=$(echo "${PULL_REQUEST_LABELS}" | jq -r 'join(",")')
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

      - name: Check if the `pythonbuild` crate changed
        id: check-pythonbuild
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          merge_base=$(git merge-base HEAD "origin/${BASE_REF}")
          if git diff --quiet "${merge_base}...HEAD" -- ':src/*.rs'; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build matrix
        id: set-matrix
        run: |
          uv run ci-matrix.py --platform windows --labels "${STEPS_GET_LABELS_OUTPUTS_LABELS}" --event ${{ github.event_name }} ${{ (steps.check-pythonbuild.outputs.changed == 'true' || github.ref == 'refs/heads/main') && '--force-crate-build' || '' }} > matrix.json

          echo "groups=$(jq -c '."windows-groups"' matrix.json)" >> $GITHUB_OUTPUT
          echo "crate-build-matrix=$(jq -c '."crate-build"' matrix.json)" >> $GITHUB_OUTPUT
          echo "libffi-prepare-hashes=$(jq -r '."libffi-prepare-hashes" // [] | join(" ")' matrix.json)" >> $GITHUB_OUTPUT

          # Display the matrix for debugging too
          cat matrix.json | jq
        env:
          STEPS_GET_LABELS_OUTPUTS_LABELS: ${{ steps.get-labels.outputs.labels }}

  build:
    needs: [generate-matrix, crate-build]
    if: fromJSON(needs.generate-matrix.outputs.groups).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.groups) }}
    name: ${{ matrix.target_triple }} / ${{ matrix.platform_toolset }}
    # The called workflow attests release distributions on main.
    permissions:
      id-token: write
      attestations: write
    uses: ./.github/workflows/windows-build.yml
    with:
      builds: ${{ toJSON(matrix.builds) }}
      dependencies: ${{ toJSON(matrix.dependencies) }}
      libffi-prepare-hashes: ${{ needs.generate-matrix.outputs.libffi-prepare-hashes }}
